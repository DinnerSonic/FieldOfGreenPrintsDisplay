<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD9E3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Send photos · Field of Green Prints</title>
<script type="module" src="/src/upload.js"></script>
</head>
<body>
<main class="up">
  <img src="assets/logo.png" alt="Field of Green Prints" class="up-logo">

  <section class="up-card">
    <h1 class="up-title">Send photos</h1>
    <p id="upIntro" class="up-text">Pick photos from your phone and they’ll show up on the booth screen.</p>

    <div id="upForm">
      <label class="up-btn up-pick">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5L5 20"/></svg>
        <span id="upPickLabel">Choose photos</span>
        <input id="upFile" type="file" accept="image/*" multiple hidden>
      </label>
      <div id="upList" class="up-list"></div>
      <button id="upSend" class="up-btn up-send" type="button" hidden>Send</button>
    </div>

    <p id="upMsg" class="up-msg" hidden></p>
  </section>
</main>
</body>
</html>
