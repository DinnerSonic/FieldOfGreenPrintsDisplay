<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Field of Green Prints — Booth Kiosk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bagel+Fat+One&display=swap">
<link rel="stylesheet" href="styles.css" />

<!-- Tweak defaults — host rewrites this block on changes -->
<script>
window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cardShape": "sticker",
  "fxRipple": true,
  "fxWobble": false,
  "fxPeel": false,
  "bgColor": "#FFD9E3",
  "finish": "gloss",
  "snake": true,
  "bgDrag": true,
  "skirtSpread": 6,
  "logoSkirtSpread": 4,
  "skirtMerge": 100,
  "skirtStyle": "current",
  "cardLip": false,
  "transition": "push",
  "buttonTexture": "wispy"
}/*EDITMODE-END*/;
</script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<!-- Mercury shader background (plain JS) -->
<script src="shader-bg.js"></script>

<!-- Component scripts (order matters: icons & fx & tweaks-panel before screens, screens before app) -->
<script type="text/babel" src="tweaks-panel.jsx?v=1"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="fx.jsx"></script>
<script type="text/babel" src="shapes.jsx"></script>
<script type="text/babel" src="screens/menu.jsx"></script>
